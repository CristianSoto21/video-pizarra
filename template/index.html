<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>video-pizarra</title>
<!-- fonts ship with the project (no network needed at render time) -->
<link href="node_modules/@fontsource/caveat/600.css" rel="stylesheet">
<link href="node_modules/@fontsource/caveat/700.css" rel="stylesheet">
<link href="node_modules/@fontsource/kalam/400.css" rel="stylesheet">
<link href="node_modules/@fontsource/kalam/700.css" rel="stylesheet">
<link href="node_modules/@fontsource/jetbrains-mono/500.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1b1b1b;overflow:hidden}
  #wrap{position:absolute;inset:0;display:grid;place-items:center}
  svg#stage{display:block;transform-origin:center}
  body.preview svg#stage{transform:scale(var(--k,0.45))}
  .hand{font-family:Caveat,"Comic Sans MS",cursive;font-weight:700}
  .kalam{font-family:Kalam,"Comic Sans MS",cursive}
  .code{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500}
</style>
</head>
<body>
<div id="wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="hand.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
